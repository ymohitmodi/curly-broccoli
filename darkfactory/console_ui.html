<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dark Factory — Owner's Console</title>
<style>
  :root{
    --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --hair:#e1e0d9; --ring:rgba(11,11,11,.10); --accent:#2a78d6; --accent-ink:#fff;
    --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
    --f1:#86b6ef; --f2:#5598e7; --f3:#2a78d6; --f4:#1c5cab; --f5:#104281;
    --shadow:0 1px 2px rgba(11,11,11,.05),0 8px 24px rgba(11,11,11,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --page:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink2:#c3c2b7; --muted:#898781;
      --hair:#2c2c2a; --ring:rgba(255,255,255,.10); --accent:#3987e5;
      --f1:#9ec5f4; --f2:#6da7ec; --f3:#3987e5; --f4:#256abf; --f5:#184f95;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--page);color:var(--ink);display:flex}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
  a{color:var(--accent);text-decoration:none}
  ::selection{background:var(--accent);color:var(--accent-ink)}

  /* ---------- shell ---------- */
  #side{width:228px;min-width:228px;border-right:1px solid var(--hair);padding:20px 12px;display:flex;flex-direction:column;gap:2px;background:var(--surface)}
  #side .logo{font-weight:700;font-size:16px;letter-spacing:.2px;padding:4px 10px 16px;display:flex;gap:8px;align-items:center}
  #side .logo span{font-size:20px}
  #side .nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--ink2);width:100%;text-align:left;font-weight:500}
  #side .nav svg{width:17px;height:17px;flex:none;opacity:.75}
  #side .nav:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}
  #side .nav.on{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--ink);font-weight:600}
  #side .nav .badge{margin-left:auto;background:var(--crit);color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:1px 7px;display:none}
  #side .nav .badge.show{display:inline}
  #side .foot{margin-top:auto;padding:10px;font-size:12px;color:var(--muted)}
  #main{flex:1;overflow-y:auto;padding:28px 32px 80px;max-width:1160px}
  h1{font-size:21px;font-weight:700;margin-bottom:2px}
  .sub{color:var(--ink2);margin-bottom:22px;font-size:14px}
  h2{font-size:14px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.5px;margin:26px 0 10px}

  /* ---------- primitives ---------- */
  .card{background:var(--surface);border:1px solid var(--ring);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow)}
  .grid{display:grid;gap:14px}
  .tiles{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
  .tile .k{font-size:12.5px;font-weight:600;color:var(--ink2)}
  .tile .v{font-size:30px;font-weight:700;line-height:1.15;margin-top:6px}
  .tile .d{font-size:12.5px;color:var(--muted);margin-top:4px}
  .tile.click{cursor:pointer}
  .tile.click:hover{border-color:var(--accent)}
  .meter{height:5px;border-radius:99px;background:color-mix(in srgb,var(--ink) 9%,transparent);margin-top:10px;overflow:hidden}
  .meter i{display:block;height:100%;border-radius:99px;background:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px;padding:8px 10px;border-bottom:1px solid var(--hair)}
  td{padding:9px 10px;border-bottom:1px solid var(--hair);vertical-align:top}
  tr:last-child td{border-bottom:0}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tr.row:hover td{background:color-mix(in srgb,var(--ink) 4%,transparent);cursor:pointer}
  .chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;border:1px solid var(--ring)}
  .chip.good{color:var(--good)} .chip.warn{color:#8a6100} .chip.crit{color:var(--crit)} .chip.serious{color:#a34317}
  @media (prefers-color-scheme: dark){ .chip.warn{color:var(--warn)} .chip.serious{color:var(--serious)} }
  .btn{border:1px solid var(--ring);background:var(--surface);border-radius:9px;padding:7px 14px;font-weight:600;font-size:13.5px;transition:.12s}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
  .btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
  .btn.danger:hover{border-color:var(--crit);color:var(--crit)}
  .btn[disabled]{opacity:.5;pointer-events:none}
  .empty{padding:34px;text-align:center;color:var(--muted)}
  .empty b{color:var(--ink2)}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
  textarea{width:100%;min-height:420px;background:var(--page);color:var(--ink);border:1px solid var(--hair);border-radius:10px;padding:14px;font-family:ui-monospace,Menlo,monospace;font-size:13px;line-height:1.5;resize:vertical}
  textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--page);padding:11px 20px;border-radius:11px;font-weight:600;font-size:14px;box-shadow:var(--shadow);opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:80vw}
  .toast.show{opacity:1}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal-bg.show{display:flex}
  .modal{background:var(--surface);border-radius:16px;padding:24px;max-width:560px;width:100%;max-height:85vh;overflow:auto;box-shadow:var(--shadow)}
  .modal h3{font-size:17px;margin-bottom:6px}
  .modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}

  /* funnel bars (ordinal ramp, direct labels, rounded data-ends) */
  .fun{display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .fun .r{display:grid;grid-template-columns:92px 1fr 34px;gap:10px;align-items:center;font-size:13px}
  .fun .r .lbl{color:var(--ink2);font-weight:600;text-align:right}
  .fun .r .bar{display:block;height:22px;border-radius:4px;min-width:4px;transition:width .4s}
  .fun .r .n{font-variant-numeric:tabular-nums;font-weight:600}

  /* score bars in candidate drawer */
  .score{display:grid;grid-template-columns:170px 1fr 44px;gap:10px;align-items:center;font-size:13px;margin:5px 0}
  .score .t{height:8px;background:color-mix(in srgb,var(--ink) 8%,transparent);border-radius:99px;overflow:hidden}
  .score .t i{display:block;height:100%;background:var(--accent);border-radius:99px}
  .kw{display:inline-block;border:1px solid var(--ring);border-radius:99px;padding:2px 10px;font-size:12px;margin:2px;color:var(--ink2)}

  /* markdown viewer */
  .md{font-size:14.5px}
  .md h1{font-size:19px;margin:14px 0 8px}.md h2{all:unset;display:block;font-size:16px;font-weight:700;margin:16px 0 6px}
  .md h3{font-size:14.5px;margin:12px 0 4px}
  .md p{margin:7px 0}.md ul{margin:7px 0 7px 22px}
  .md table{margin:10px 0;font-size:13.5px}
  .md code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:color-mix(in srgb,var(--ink) 7%,transparent);padding:1px 5px;border-radius:5px}
  .md pre{background:color-mix(in srgb,var(--ink) 6%,transparent);padding:12px;border-radius:9px;overflow-x:auto;margin:8px 0}
  .md blockquote{border-left:3px solid var(--accent);padding-left:12px;color:var(--ink2);margin:8px 0}

  .split{display:grid;grid-template-columns:250px 1fr;gap:16px;align-items:start}
  .list .item{padding:9px 12px;border-radius:9px;cursor:pointer;font-size:13.5px;display:flex;justify-content:space-between;gap:8px}
  .list .item small{color:var(--muted);white-space:nowrap}
  .list .item:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}
  .list .item.on{background:color-mix(in srgb,var(--accent) 12%,transparent);font-weight:600}
  .tabbar{display:flex;gap:6px;margin-bottom:14px}
  .tabbar button{border:1px solid var(--ring);border-radius:99px;padding:5px 15px;font-size:13px;font-weight:600;color:var(--ink2)}
  .tabbar button.on{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
  .aprv{display:flex;flex-direction:column;gap:12px}
  .aprv .card{display:flex;flex-direction:column;gap:8px}
  .aprv .head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .aprv .head .age{margin-left:auto;color:var(--muted);font-size:12.5px}
  .kv{font-size:13px;display:grid;grid-template-columns:max-content 1fr;gap:3px 16px}
  .kv b{color:var(--ink2);font-weight:600}
  .doc-check{display:flex;gap:14px;align-items:flex-start}
  .doc-check .ic{font-size:17px;width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;font-weight:800}
  .doc-check .fixtxt{white-space:pre-wrap;font-size:13px;color:var(--ink2);background:color-mix(in srgb,var(--ink) 5%,transparent);border-radius:9px;padding:10px 12px;margin-top:8px}
  @media (max-width:860px){
    body{flex-direction:column}
    #side{width:100%;min-width:0;flex-direction:row;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--hair)}
    #side .logo,#side .foot{display:none}
    #side .nav{white-space:nowrap;width:auto}
    #main{padding:18px 16px 60px}
    .split{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<nav id="side">
  <div class="logo"><span>🏭</span> Dark Factory</div>
  <button class="nav" data-p="dash">⌂ <span>Dashboard</span></button>
  <button class="nav" data-p="approvals">✍ <span>Approvals</span><span class="badge" id="bAprv"></span></button>
  <button class="nav" data-p="funnel">▤ <span>Products</span></button>
  <button class="nav" data-p="skills">⚙ <span>Skills</span></button>
  <button class="nav" data-p="docs">🗎 <span>Documents</span></button>
  <button class="nav" data-p="edit">✎ <span>Playbooks &amp; Config</span></button>
  <button class="nav" data-p="activity">≡ <span>Activity</span></button>
  <button class="nav" data-p="doctor">＋ <span>Doctor</span><span class="badge" id="bDoc"></span></button>
  <div class="foot">local · 127.0.0.1 only<br>your data never leaves this Mac</div>
</nav>
<main id="main"></main>
<div class="toast" id="toast"></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>

<script>
"use strict";
const $=s=>document.querySelector(s), main=$("#main");
const api=async(p,opt)=>{const r=await fetch(p,opt);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.statusText);return j};
const post=(p,body)=>api(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),3400)};
const ago=iso=>{if(!iso)return"never";const s=(Date.now()-new Date(iso))/1e3;if(s<90)return"just now";if(s<5400)return Math.round(s/60)+" min ago";if(s<172800)return Math.round(s/3600)+" h ago";return Math.round(s/86400)+" days ago"};
const money=v=>"$"+Number(v).toLocaleString();
const stChip=s=>({ok:'<span class="chip good">✓ OK</span>',warn:'<span class="chip warn">⚠ Attention</span>',fail:'<span class="chip crit">✕ Problem</span>'}[s]||esc(s));

function modal(html,acts){const bg=$("#modalBg"),m=$("#modal");m.innerHTML=html+'<div class="acts">'+(acts||'<button class="btn" onclick="closeModal()">Close</button>')+"</div>";bg.classList.add("show")}
function closeModal(){$("#modalBg").classList.remove("show")}
$("#modalBg").addEventListener("click",e=>{if(e.target.id==="modalBg")closeModal()});

/* tiny markdown renderer for factory artifacts */
function md(src){
  const lines=String(src).split("\n");let out=[],i=0,inCode=false,list=false,tbl=[];
  const flushT=()=>{if(!tbl.length)return;const rows=tbl.filter(r=>!/^\s*\|[\s:|-]+\|\s*$/.test(r)).map(r=>r.replace(/^\s*\||\|\s*$/g,"").split("|"));
    out.push("<table><tr>"+rows[0].map(c=>"<th>"+inline(c.trim())+"</th>").join("")+"</tr>"+rows.slice(1).map(r=>"<tr>"+r.map(c=>"<td>"+inline(c.trim())+"</td>").join("")+"</tr>").join("")+"</table>");tbl=[]};
  const inline=s=>esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<i>$2</i>");
  const endL=()=>{if(list){out.push("</ul>");list=false}};
  for(;i<lines.length;i++){const L=lines[i];
    if(L.trim().startsWith("```")){flushT();endL();out.push(inCode?"</pre>":"<pre>");inCode=!inCode;continue}
    if(inCode){out.push(esc(L)+"\n");continue}
    if(/^\s*\|/.test(L)){endL();tbl.push(L);continue} flushT();
    const h=L.match(/^(#{1,3})\s+(.*)/);
    if(h){endL();out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`);continue}
    if(/^\s*[-*]\s+/.test(L)){if(!list){out.push("<ul>");list=true}out.push("<li>"+inline(L.replace(/^\s*[-*]\s+/,""))+"</li>");continue}
    endL();
    if(/^>\s?/.test(L)){out.push("<blockquote>"+inline(L.replace(/^>\s?/,""))+"</blockquote>");continue}
    if(L.trim()==="")continue;
    out.push("<p>"+inline(L)+"</p>");
  }
  flushT();endL();if(inCode)out.push("</pre>");
  return '<div class="md">'+out.join("")+"</div>";
}

/* ------------------------------------------------ router */
const PAGES={dash,approvals,funnel,skills,docs,edit,activity,doctor};
function nav(p,arg){location.hash=arg?p+"/"+arg:p}
async function route(){
  const [p,arg]=(location.hash.replace("#","")||"dash").split("/");
  document.querySelectorAll("#side .nav").forEach(b=>b.classList.toggle("on",b.dataset.p===p));
  main.innerHTML='<div class="empty">Loading…</div>';
  try{await (PAGES[p]||dash)(arg)}catch(e){main.innerHTML=`<div class="card"><b>Could not load this page.</b><p class="sub" style="margin:8px 0 0">${esc(e.message)} — is the console still running? Try refreshing, or open the Doctor tab.</p></div>`}
  refreshBadges();
}
document.querySelectorAll("#side .nav").forEach(b=>b.onclick=()=>nav(b.dataset.p));
window.addEventListener("hashchange",route);

async function refreshBadges(){
  try{const o=await api("/api/overview");const b=$("#bAprv");b.textContent=o.approvals_pending;b.classList.toggle("show",o.approvals_pending>0);
    const d=await api("/api/doctor");const n=d.filter(c=>c.status!=="ok").length;const bd=$("#bDoc");bd.textContent=n;bd.classList.toggle("show",n>0);
  }catch(e){}
}

/* ------------------------------------------------ dashboard */
async function dash(){
  const o=await api("/api/overview");
  const stages=["idea","sourcing","listing","launched","live"];
  const ramp=["var(--f1)","var(--f2)","var(--f3)","var(--f4)","var(--f5)"];
  const maxN=Math.max(1,...stages.map(s=>o.funnel[s]||0));
  const failCount=o.skills.filter(s=>s.failures>0).length;
  main.innerHTML=`
  <h1>Good ${new Date().getHours()<12?"morning":new Date().getHours()<18?"afternoon":"evening"} 👋</h1>
  <div class="sub">Here's what your factory has been doing, and what it needs from you.</div>
  <div class="grid tiles">
    <div class="card tile click" onclick="nav('approvals')">
      <div class="k">Waiting for your signature</div>
      <div class="v" style="${o.approvals_pending?'color:var(--crit)':''}">${o.approvals_pending}</div>
      <div class="d">${o.approvals_pending?"money decisions ready — review now":"nothing blocked on you ✓"}</div>
    </div>
    <div class="card tile click" onclick="nav('activity')">
      <div class="k">Actions in last 24 h</div><div class="v">${o.episodes_24h}</div>
      <div class="d">${o.episodes_24h?"the factory is alive":"quiet — was the Mac asleep?"}</div>
    </div>
    <div class="card tile">
      <div class="k">AI budget today · ${esc(o.llm.mode)} mode</div>
      <div class="v">${o.llm.calls_today}<span style="font-size:15px;color:var(--muted)"> / ${o.llm.max_per_day}</span></div>
      <div class="meter"><i style="width:${Math.min(100,100*o.llm.calls_today/o.llm.max_per_day)}%"></i></div>
    </div>
    <div class="card tile click" onclick="nav('funnel')">
      <div class="k">Strategy fitness</div>
      <div class="v">${o.genome&&o.genome.fitness!=null?Number(o.genome.fitness).toFixed(2):"—"}</div>
      <div class="d">${o.genome?"generation "+o.genome.generation+" · evolves weekly":"seeds on first run"}</div>
    </div>
  </div>

  ${o.tasks&&o.tasks.length?`<h2>🧗 Your work orders — the validation ladder is waiting on you</h2>
  <div class="card" style="display:flex;flex-direction:column;gap:10px">
    ${o.tasks.map(t=>`<div style="display:flex;gap:12px;align-items:flex-start;border-bottom:1px solid var(--hair);padding-bottom:10px">
      <div style="flex:1"><b style="font-size:13.5px">${esc(t.title)}</b>
      <div style="font-size:13px;color:var(--ink2);margin-top:2px">${esc(t.instructions)}</div></div>
      <button class="btn primary" style="flex:none" onclick="taskDone(${t.id},this)">Mark done</button>
    </div>`).join("")}
  </div>`:""}

  <h2>Product funnel</h2>
  <div class="card"><div class="fun">
    ${stages.map((s,i)=>{const n=o.funnel[s]||0;return `<div class="r"><span class="lbl">${s}</span>
      <span><span class="bar" style="${n?`width:${Math.max(2,100*n/maxN)}%`:"width:0;min-width:0"};background:${ramp[i]}"></span></span>
      <span class="n">${n}</span></div>`}).join("")}
  </div>
  ${Object.values(o.funnel).some(v=>v)?"":'<div class="empty">No products yet. Run <b>product_research</b> from the Skills tab to start the hunt.</div>'}</div>

  ${o.top_pursue.length?`<h2>Top candidates (PURSUE)</h2>
  <div class="card"><table><tr><th>#</th><th>Product concept</th><th>Stage</th><th class="num">Score</th></tr>
  ${o.top_pursue.map(c=>`<tr class="row" onclick="nav('funnel',${c.id})"><td>${c.id}</td><td>${esc(c.name)}</td><td>${esc(c.stage)}</td><td class="num">${Number(c.composite).toFixed(2)}</td></tr>`).join("")}
  </table></div>`:""}

  <h2>Skills health ${failCount?`· <span class="chip crit">✕ ${failCount} failing</span>`:""}</h2>
  <div class="card"><table><tr><th>Skill</th><th>Every</th><th>Last run</th><th>Status</th><th></th></tr>
  ${o.skills.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${s.every_hours} h</td><td>${ago(s.last_run)}</td>
    <td>${s.failures>0?`<span class="chip crit">✕ ${s.failures} failures</span>`:s.due?'<span class="chip warn">⚠ due</span>':'<span class="chip good">✓ on schedule</span>'}</td>
    <td class="num"><button class="btn" onclick="runSkill('${s.name}',this)">Run now</button></td></tr>`).join("")}
  </table></div>`;
}

async function taskDone(id,btn){
  btn.disabled=true;
  try{const r=await post(`/api/tasks/${id}/done`);toast("✓ "+r.message);route()}
  catch(e){btn.disabled=false;toast("✕ "+e.message)}
}

/* ------------------------------------------------ skills */
async function runSkill(name,btn){
  btn.disabled=true;btn.textContent="Running…";
  try{const {job}=await post(`/api/skills/${name}/run`);
    const poll=async()=>{const j=await api("/api/jobs/"+job);
      if(j.status==="running"){setTimeout(poll,1500);return}
      btn.disabled=false;btn.textContent="Run now";
      toast((j.status==="done"?"✓ ":"✕ ")+name+": "+(j.summary||j.status));
      if(location.hash.includes("skills")||location.hash===""||location.hash==="#dash")route();
    };poll();
  }catch(e){btn.disabled=false;btn.textContent="Run now";toast("✕ "+e.message)}
}
async function skills(){
  const o=await api("/api/overview");
  const DESC={product_research:"Hunts your allowed categories, kills weak niches with hard math, scores the rest, shortlists products worth pursuing.",
    supplier_sourcing:"Builds the Alibaba package: RFQ message, spec sheet, negotiation ladder, walk-away price, and the full cash plan.",
    keyword_seo:"Builds the master keyword map — what buyers type, clustered by intent, with a placement for every term.",
    listing_writer:"Writes the complete Amazon listing. Field limits enforced by code, not hope.",
    launch_strategist:"Plans the first 90 days week by week: Vine, coupons, PPC ramp, milestones, and kill criteria.",
    ad_optimizer:"Reads campaign data, cuts bleeders, harvests winners, steps bids toward your target ACOS.",
    review_miner:"Turns competitor reviews into factory spec upgrades and listing copy angles.",
    inventory_planner:"Watches your cash: PO cash timelines, reorder points, low-inventory-fee exposure, over-commitment warnings.",
    evolution:"The weekly Darwin step — breeds the strategy that made you money.",
    digest:"Writes your daily one-page owner's report."};
  main.innerHTML=`<h1>Skills</h1><div class="sub">Your analyst team. Each runs on its own schedule — or press Run now.</div>
  <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr))">
  ${o.skills.map(s=>`<div class="card">
    <div style="display:flex;align-items:center;gap:8px"><b style="font-size:15px">${esc(s.name)}</b>
      ${s.failures>0?`<span class="chip crit">✕ ${s.failures} failures</span>`:s.due?'<span class="chip warn">⚠ due</span>':'<span class="chip good">✓ ok</span>'}</div>
    <p style="color:var(--ink2);font-size:13.5px;margin:8px 0 12px">${DESC[s.name]||""}</p>
    <div style="display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)">
      every ${s.every_hours} h · last ${ago(s.last_run)}
      <button class="btn" style="margin-left:auto" onclick="runSkill('${s.name}',this)">Run now</button></div>
  </div>`).join("")}</div>`;
}

/* ------------------------------------------------ approvals */
async function approvals(){
  const items=await api("/api/approvals");
  const LBL={place_order:["🧾 Purchase order","This will commit real money to a supplier. Open the sourcing package first."],
    publish_listing:["🌐 Publish listing","Makes the product page live on Amazon."],
    change_bids:["📈 PPC bid changes","Adjusts your advertising spend."],
    change_budget:["💵 Ad budget change","Raises or lowers a campaign budget."]};
  main.innerHTML=`<h1>Approvals</h1><div class="sub">The factory prepared these money decisions. Nothing happens until you sign. <b>Rejecting is always safe.</b></div>
  <div class="aprv">${items.length?items.map(a=>{
    const [title,hint]=LBL[a.action]||["⚙ "+a.action,""];
    const art=a.payload.artifact?String(a.payload.artifact).split("/").pop():null;
    return `<div class="card">
      <div class="head"><b style="font-size:15px">${title}</b><span class="chip">from ${esc(a.skill)}</span><span class="age">#${a.id} · ${ago(a.ts)}</span></div>
      ${hint?`<div style="font-size:13px;color:var(--ink2)">${hint}</div>`:""}
      <div class="kv">${Object.entries(a.payload).filter(([k])=>k!=="artifact").map(([k,v])=>`<b>${esc(k)}</b><span>${esc(typeof v==="object"?JSON.stringify(v).slice(0,220):v)}</span>`).join("")}</div>
      <div style="display:flex;gap:10px;margin-top:6px;flex-wrap:wrap">
        ${art?`<button class="btn" onclick="openDoc('artifacts','${esc(art)}')">📄 Read the full package</button>`:""}
        <button class="btn primary" style="margin-left:auto" onclick="decide(${a.id},'approve','${title.replace(/'/g,"")}')">Approve</button>
        <button class="btn danger" onclick="decide(${a.id},'reject','${title.replace(/'/g,"")}')">Reject</button>
      </div></div>`;}).join("")
    :'<div class="card empty"><b>Nothing waiting for you.</b><br>When the factory wants to spend money, it will appear here first.</div>'}</div>`;
}
function decide(id,decision,title){
  modal(`<h3>${decision==="approve"?"Approve":"Reject"} — ${esc(title)}?</h3>
    <p style="color:var(--ink2);font-size:14px">${decision==="approve"
      ?"You are signing off on this action. Make sure you read the package."
      :"The factory will drop this action and move on. This is always safe."}</p>`,
    `<button class="btn" onclick="closeModal()">Cancel</button>
     <button class="btn ${decision==='approve'?'primary':'danger'}" onclick="doDecide(${id},'${decision}')">${decision==="approve"?"Yes, approve":"Yes, reject"}</button>`);
}
async function doDecide(id,decision){
  try{await post(`/api/approvals/${id}`,{decision});closeModal();toast(`✓ #${id} ${decision}d`);route()}
  catch(e){toast("✕ "+e.message)}
}

/* ------------------------------------------------ products / funnel */
async function funnel(openId){
  const cands=await api("/api/candidates");
  window._cands=cands;
  main.innerHTML=`<h1>Products</h1><div class="sub">Every idea the factory evaluated, and where it stands. Click a row for details and to log real results.</div>
  <div class="tabbar" id="fTabs">${["ALL","PURSUE","WATCH","DROP"].map((v,i)=>`<button class="${i===0?"on":""}" onclick="fFilter('${v}',this)">${v}</button>`).join("")}</div>
  <div class="card"><table id="fTbl"><tr><th>#</th><th>Product concept</th><th>Category</th><th>Verdict</th><th>Stage</th><th class="num">Score</th></tr></table>
  <div class="empty" id="fEmpty" style="display:none"><b>Nothing here yet.</b><br>Run product_research from the Skills tab — or your gates are strict today (that's them protecting your money).</div></div>
  <div id="fDetail"></div>`;
  fFilter("ALL");
  if(openId)openCand(Number(openId));
}
function fFilter(v,btn){
  if(btn)document.querySelectorAll("#fTabs button").forEach(b=>b.classList.toggle("on",b===btn));
  const rows=window._cands.filter(c=>v==="ALL"||c.verdict===v);
  const V={PURSUE:'<span class="chip good">✓ PURSUE</span>',WATCH:'<span class="chip warn">⚠ WATCH</span>',DROP:'<span class="chip">DROP</span>'};
  $("#fTbl").innerHTML=`<tr><th>#</th><th>Product concept</th><th>Category</th><th>Verdict</th><th>Stage</th><th class="num">Score</th></tr>`+
    rows.map(c=>`<tr class="row" onclick="openCand(${c.id})"><td>${c.id}</td><td>${esc(c.name)}</td><td>${esc(c.category)}</td><td>${V[c.verdict]||esc(c.verdict)}</td><td>${esc(c.stage)}</td><td class="num">${Number(c.composite||0).toFixed(2)}</td></tr>`).join("");
  $("#fEmpty").style.display=rows.length?"none":"block";
}
async function openCand(id){
  const c=await api("/api/candidates/"+id);
  const S={demand:"Demand",competition_gap:"Competition gap",margin_potential:"Margin potential",differentiation:"Differentiation",operational_simplicity:"Operational simplicity"};
  const o=c.outcome||{};
  $("#fDetail").innerHTML=`<h2>#${c.id} — details</h2><div class="card">
    <b style="font-size:16px">${esc(c.name)}</b>
    <div style="color:var(--ink2);font-size:13.5px;margin:2px 0 12px">${esc(c.niche)} · ${esc(c.category)} · stage: <b>${esc(c.stage)}</b></div>
    ${c.data&&c.data.differentiation_angle?`<p style="font-size:14px;margin-bottom:10px"><b>Edge:</b> ${esc(c.data.differentiation_angle)}</p>`:""}
    ${Object.entries(S).map(([k,l])=>`<div class="score"><span>${l}</span><span class="t"><i style="width:${100*(c.scores?.[k]||0)}%"></i></span><span class="num">${Number(c.scores?.[k]||0).toFixed(2)}</span></div>`).join("")}
    ${c.data&&c.data.risks&&c.data.risks.length?`<p style="font-size:13.5px;margin-top:10px"><b>Risks:</b> ${c.data.risks.map(esc).join(" · ")}</p>`:""}
    ${c.keywords.length?`<div style="margin-top:12px">${c.keywords.slice(0,25).map(k=>`<span class="kw">${esc(k.keyword)}</span>`).join("")}</div>`:""}
    <h2 style="margin-top:20px">Log real results <span style="text-transform:none;letter-spacing:0;font-weight:500">— this is what makes the strategy evolve</span></h2>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px">
      <label style="font-size:12.5px;color:var(--ink2)">Units sold / month<input class="btn" style="width:100%;margin-top:4px" id="oUnits" type="number" value="${o.monthly_units??""}" placeholder="e.g. 320"></label>
      <label style="font-size:12.5px;color:var(--ink2)">Net margin (0.38 = 38%)<input class="btn" style="width:100%;margin-top:4px" id="oMargin" type="number" step="0.01" value="${o.margin_pct??""}" placeholder="e.g. 0.38"></label>
      <label style="font-size:12.5px;color:var(--ink2)">Star rating<input class="btn" style="width:100%;margin-top:4px" id="oRating" type="number" step="0.1" value="${o.rating??""}" placeholder="e.g. 4.6"></label>
      <label style="font-size:12.5px;color:var(--ink2)">Cash cycle days (optional)<input class="btn" style="width:100%;margin-top:4px" id="oCcd" type="number" value="${o.cash_conversion_days??""}" placeholder="wire → recovered"></label>
    </div>
    <div style="margin-top:12px"><button class="btn primary" onclick="saveOutcome(${c.id})">Save results</button></div>
  </div>`;
  $("#fDetail").scrollIntoView({behavior:"smooth"});
}
async function saveOutcome(id){
  const g=x=>$(x).value.trim();
  if(!g("#oUnits")||!g("#oMargin")||!g("#oRating"))return toast("Fill units, margin and rating (cash days optional)");
  try{const r=await post(`/api/candidates/${id}/outcome`,{monthly_units:g("#oUnits"),margin_pct:g("#oMargin"),rating:g("#oRating"),cash_cycle_days:g("#oCcd")||null});
    toast("✓ "+(r.message||"saved"))}catch(e){toast("✕ "+e.message)}
}

/* ------------------------------------------------ documents */
async function docs(arg){await filePage("docs",arg,[["reports","Daily digests"],["artifacts","Deliverables"]],false)}
async function edit(arg){await filePage("edit",arg,[["playbooks","Playbooks (coach your team)"],["config","Config (your business law)"]],true)}
function openDoc(dir,name){nav("docs",dir+":"+name)}
async function filePage(page,arg,tabs,editable){
  let [dir,sel]=(arg||"").split(":");dir=dir||tabs[0][0];
  const files=await api("/api/files?dir="+dir);
  if(!sel&&files.length)sel=files[0].name;
  main.innerHTML=`<h1>${page==="docs"?"Documents":"Playbooks & Config"}</h1>
  <div class="sub">${page==="docs"?"Everything the factory produced — digests and ready-to-use deliverables.":"Plain-text levers. Playbooks are instructions your analysts read before every task; config is the law they obey. Saving validates before anything is written."}</div>
  <div class="tabbar">${tabs.map(([k,l])=>`<button class="${k===dir?"on":""}" onclick="nav('${page}','${k}')">${l}</button>`).join("")}</div>
  <div class="split"><div class="card list" style="padding:8px">${files.length?files.map(f=>`<div class="item ${f.name===sel?"on":""}" onclick="nav('${page}','${dir}:${f.name}')"><span>${esc(f.name)}</span><small>${f.modified.slice(5,16).replace("T"," ")}</small></div>`).join(""):'<div class="empty">No files yet.<br>They appear as skills run.</div>'}</div>
  <div class="card" id="fileView">${sel?"Loading…":'<div class="empty">Select a file.</div>'}</div></div>`;
  if(!sel)return;
  try{const f=await api(`/api/file?dir=${dir}&name=${encodeURIComponent(sel)}`);
    $("#fileView").innerHTML=editable
      ?`<div style="display:flex;align-items:center;margin-bottom:10px"><b>${esc(sel)}</b>
          <button class="btn primary" style="margin-left:auto" onclick="saveFile('${dir}','${esc(sel)}')">Save</button></div>
        <textarea id="fileTa">${esc(f.content)}</textarea>
        <p style="font-size:12.5px;color:var(--muted);margin-top:8px">Tip: write playbook changes the way you'd brief a sharp employee. The very next run obeys them.</p>`
      :`<div style="display:flex;align-items:center;margin-bottom:10px"><b>${esc(sel)}</b></div>${md(f.content)}`;
  }catch(e){$("#fileView").innerHTML=`<div class="empty">${esc(e.message)}</div>`}
}
async function saveFile(dir,name){
  try{const r=await post("/api/file",{dir,name,content:$("#fileTa").value});toast("✓ "+r.message)}
  catch(e){toast("✕ "+e.message)}
}

/* ------------------------------------------------ activity */
async function activity(){
  const eps=await api("/api/episodes?hours=72");
  const IC={run:"✓",error:"✕",skipped:"⏸",fix:"🔧",approve:"✍",reject:"✍",outcome:"📊",start:"▶"};
  main.innerHTML=`<h1>Activity</h1><div class="sub">Everything the factory did in the last 3 days, newest first.</div>
  <div class="card">${eps.length?`<table>${eps.map(e=>`<tr><td style="white-space:nowrap;color:var(--muted)" class="mono">${e.ts.slice(5,16).replace("T"," ")}</td>
    <td style="white-space:nowrap">${IC[e.kind]||"·"} <b>${esc(e.skill)}</b></td>
    <td style="${e.kind==="error"?"color:var(--crit)":""}">${esc(e.summary)}</td></tr>`).join("")}</table>`
    :'<div class="empty"><b>No activity yet.</b><br>Run a skill from the Skills tab, or start the 24/7 service.</div>'}</div>`;
}

/* ------------------------------------------------ doctor */
async function doctor(){
  main.innerHTML=`<h1>Doctor</h1><div class="sub">Every known problem, checked automatically — with a fix for each. Green means go.</div><div id="docBody" class="grid">Running checks…</div>`;
  const checks=await api("/api/doctor");
  const bad=checks.filter(c=>c.status!=="ok").length;
  const IC={ok:["✓","var(--good)"],warn:["!","var(--warn)"],fail:["✕","var(--crit)"]};
  $("#docBody").innerHTML=`
    <div class="card" style="display:flex;align-items:center;gap:12px">
      <span style="font-size:24px">${bad?(checks.some(c=>c.status==="fail")?"🔴":"🟡"):"🟢"}</span>
      <div><b>${bad?bad+" item"+(bad>1?"s need":" needs")+" attention":"All systems healthy"}</b>
      <div style="font-size:13px;color:var(--ink2)">${bad?"Work top to bottom — each card tells you exactly what to do.":"Your factory is fully operational."}</div></div>
      <button class="btn" style="margin-left:auto" onclick="doctor()">Re-check</button></div>
    ${checks.sort((a,b)=>({fail:0,warn:1,ok:2}[a.status]-{fail:0,warn:1,ok:2}[b.status])).map(c=>{
      const [ic,col]=IC[c.status];
      return `<div class="card doc-check">
        <span class="ic" style="color:${col};background:color-mix(in srgb,${col} 14%,transparent)">${ic}</span>
        <div style="flex:1"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b>${esc(c.name)}</b>${stChip(c.status)}</div>
        <div style="font-size:13.5px;color:var(--ink2);margin-top:3px">${esc(c.detail)}</div>
        ${c.status!=="ok"&&c.fix?`<div class="fixtxt">${esc(c.fix)}</div>`:""}
        ${c.fix_action?`<div style="margin-top:10px"><button class="btn primary" onclick="docFix('${c.fix_action}')">🔧 Fix it for me</button></div>`:""}
        </div></div>`}).join("")}`;
}
async function docFix(action){
  try{const r=await post("/api/doctor/fix",{action});toast("✓ "+r.message);doctor()}
  catch(e){toast("✕ "+e.message)}
}

route();
setInterval(refreshBadges,45000);
</script>
</body>
</html>
